services:
  parrot-api:
    image: ${AR_REGISTRY}/parrot-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:8080"
    env_file:
      - /app/.env.prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    logging:
      driver: journald
      options:
        tag: parrot-api

  parrot-grpc:
    image: ${AR_REGISTRY}/parrot-grpc:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:8080"
    env_file:
      - /app/.env.prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    logging:
      driver: journald
      options:
        tag: parrot-grpc

  whatsapp-ingestor:
    image: ${AR_REGISTRY}/whatsapp-ingestor:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - /app/.env.prod
    environment:
      - DOTNET_ENVIRONMENT=Production
    logging:
      driver: journald
      options:
        tag: whatsapp-ingestor
