services:
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [internal]

  kafka-topic-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists --topic whatsapp.messages
      --partitions 3 --replication-factor 1
    networks: [internal]
    restart: "no"

  parrot-api:
    build:
      context: /home/ubuntu/Parrot
      dockerfile: Parrot.Api/Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
       - DataProtection__KeyRingPath=/app/data-protection-keys
       - DataProtection__CertificatePath=/run/secrets/parrot-data-protection.pfx
       - DataProtection__CertificatePassword=${DATA_PROTECTION_CERTIFICATE_PASSWORD}
    volumes:
       - /home/ubuntu/app/data-protection-keys:/app/data-protection-keys
       - /home/ubuntu/app/secrets/parrot-data-protection.pfx:/run/secrets/parrot-data-protection.pfx:ro
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
#      interval: 15s
#      timeout: 5s
#      retries: 5
#      start_period: 20s
    networks: [internal]

  parrot-grpc:
    build:
      context: /home/ubuntu/Parrot
      dockerfile: Parrot.APi.Grpc/Dockerfile
    restart: unless-stopped
    env_file: .env.prod
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
#      interval: 15s
#      timeout: 5s
#      retries: 5
#      start_period: 20s
    networks: [internal]

  parrot-web:
    build:
      context: /home/ubuntu/Parrot
      dockerfile: Parrot.Web/Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      - parrot-api
      - parrot-grpc
    networks: [internal]

  whatsapp-ingestor:
    build:
      context: /home/ubuntu/Parrot
      dockerfile: WhatsAppMessageIngestor/Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      kafka-topic-init: { condition: service_completed_successfully }
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - parrot-api
      - parrot-grpc
      - parrot-web
    networks: [internal]

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew; sleep 12h; done"
    networks: [internal]

networks:
  internal:   # postgres/mongo/kafka — never touches nginx

volumes:
  kafka_data:
