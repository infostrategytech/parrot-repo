events {}

http {
    server {
        listen 80;
        server_name api.parrot.irechargetech.com  grpc.parrot.irechargetech.com  app.parrot.irechargetech.com;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name app.parrot.irechargetech.com;
        ssl_certificate     /etc/letsencrypt/live/app.parrot.irechargetech.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.parrot.irechargetech.com/privkey.pem;
        location / {
            proxy_pass http://parrot-web:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name api.parrot.irechargetech.com;
        ssl_certificate     /etc/letsencrypt/live/api.parrot.irechargetech.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.parrot.irechargetech.com/privkey.pem;
        location / {
            proxy_pass http://parrot-api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl http2;
        server_name  grpc.parrot.irechargetech.com;
        ssl_certificate     /etc/letsencrypt/live/grpc.parrot.irechargetech.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/grpc.parrot.irechargetech.com/privkey.pem;
        location / {
            grpc_pass grpc://parrot-grpc:8080;
        }
    }
}
