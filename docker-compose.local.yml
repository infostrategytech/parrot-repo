name: parrot-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: parrot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parrot_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parrot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [parrot]

  mongodb:
    image: mongo:7
    restart: unless-stopped
    # Published on loopback only, for the MongoDB tests (PARROT_TEST_MONGO=mongodb://localhost:27018).
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [parrot]

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # PLAINTEXT is for the other containers; HOST is published on loopback
      # only, for the Kafka tests (PARROT_TEST_KAFKA=localhost:29092).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [parrot]

  kafka-topic-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    # Auto-create is off, so every topic is made here. The keyed topics get
    # 24 partitions, the most worker instances that can share one topic's load.
    # messages.persisted carries MessagePersisted events for realtime delivery.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        create() { /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --replication-factor 1 --topic "$$1" --partitions "$$2"; }
        create messages.inbound 24
        create messages.inbound.dlq 3
        create messages.persisted 24
        create messages.media 24
        create messages.media.dlq 3
        create messages.settled 6
        create messages.outbound 24
        create messages.outbound.dlq 3
        create agent.events 6
    restart: "no"
    networks: [parrot]

  # Shared by realtime delivery (who is online) and the catalog cache. Nothing
  # here is meant to survive: no snapshots, no append-only file, no volume. A
  # restart empties it; clients register again on their next heartbeat, the
  # cache refills, and messages live in MongoDB. The memory cap evicts the
  # least-recently-used key, which costs either user at most a re-register or
  # a cache miss.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    # Published on loopback only, for the Redis tests (PARROT_TEST_REDIS=localhost:16379).
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [parrot]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks: [parrot]

  # The object store the image uploads land in. It speaks S3, so the same code
  # path runs here and against a real bucket — only the endpoint differs. MinIO
  # archived its community edition and pulled its own images off Docker Hub,
  # so these are maintained repackages of the same server and client.
  minio:
    image: sourcemation/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-parrot-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-parrot-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [parrot]

  # Creates the bucket and opens it for public reads once the server answers;
  # the retry loop is what makes that safe when both start together. Doing it
  # out here keeps bucket lifecycle out of the API entirely.
  minio-init:
    image: bitnamilegacy/minio-client:latest
    restart: on-failure
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-parrot-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-parrot-local-secret}
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done;
        mc mb --ignore-existing local/parrot;
        mc anonymous set download local/parrot;
        # Customers' pictures and files: no anonymous access. The API is the only reader.
        mc mb --ignore-existing local/parrot-private;
    networks: [parrot]

  parrot-api:
    build:
      context: .
      dockerfile: Parrot.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=parrot;Username=postgres;Password=${POSTGRES_PASSWORD:-parrot_dev_password}
      Database__ApplyMigrations: "true"
      DataProtection__KeyRingPath: /app/data-protection-keys
      WhatsApp__WebhookBaseUrl: ${WHATSAPP_WEBHOOK_BASE_URL:-http://localhost:5222}
      WhatsApp__AppSecret: ${WHATSAPP_APP_SECRET:-your-app-secret}
      Facebook__WebhookBaseUrl: ${FACEBOOK_WEBHOOK_BASE_URL:-https://api.parrot.irechargetech.com}
      Facebook__AppSecret: ${FACEBOOK_APP_SECRET:-your-facebook-app-secret}
      TikTok__WebhookBaseUrl: ${TIKTOK_WEBHOOK_BASE_URL:-https://api.parrot.irechargetech.com}
      Instagram__WebhookBaseUrl: ${INSTAGRAM_WEBHOOK_BASE_URL:-https://api.parrot.irechargetech.com}
      MongoDB__ConnectionString: mongodb://mongodb:27017
      MongoDB__Database: parrot
      MongoDB__Collection: messages
      JwtSettings__Secret: ${JWT_SECRET:-parrot-local-development-secret-change-me}
      JwtSettings__Issuer: ParrotApi
      JwtSettings__Audience: ParrotApp
      Kafka__BootstrapServers: kafka:9092
      Redis__ConnectionString: redis:6379
      GoogleOAuth__ClientId: ${GOOGLE_CLIENT_ID:-local-placeholder.apps.googleusercontent.com}
      GoogleOAuth__ClientSecret: ${GOOGLE_CLIENT_SECRET:-local-placeholder}
      EmailSettings__SmtpHost: mailpit
      EmailSettings__SmtpPort: 1025
      EmailSettings__UseStartTls: "false"
      EmailSettings__RequiresAuthentication: "false"
      EmailSettings__SendInDevelopment: "true"
      EmailSettings__SmtpUser: ""
      EmailSettings__SmtpPassword: ""
      EmailSettings__FromAddress: no-reply@parrot.local
      EmailSettings__FromName: Parrot Local
      EmailSettings__BaseUrl: http://localhost:5255
      FrontendSettings__BaseUrl: http://localhost:5255
      # The AI orchestrator (Omni-AI). Off until one is running beside this
      # stack; then agents answer customers and the AI Operations figures show.
      OmniAi__Enabled: ${OMNI_AI_ENABLED:-false}
      OmniAi__BaseUrl: ${OMNI_AI_BASE_URL:-http://host.docker.internal:8000}
      # The object store for image uploads. The app writes to MinIO over the
      # compose network; the URLs it hands back are read by the browser
      # through the published port, so the two bases are not the same host.
      Storage__Provider: S3
      Storage__Bucket: parrot
      Storage__Region: us-east-1
      Storage__ServiceUrl: http://minio:9000
      Storage__PublicBaseUrl: http://localhost:9000/parrot
      Storage__AccessKey: ${MINIO_ROOT_USER:-parrot-local}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:-parrot-local-secret}
      Storage__MediaBucket: parrot-private
      # The verification code every sign-up on this stack accepts, so no
      # mailbox is needed to finish one; the API refuses to start with it set
      # outside Development. The breach lookup is off to keep the stack offline.
      Auth__DevelopmentVerificationCode: "222222"
      Auth__CheckBreachedPasswords: "false"
      # Keep the code flow on locally; the deployed dev environment has it off.
      FeatureFlags__RequireEmailVerification: "true"
    ports:
      - "5222:8080"
    volumes:
      - api_data_protection_keys:/app/data-protection-keys
    depends_on:
      postgres:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      # Started, not healthy: the API boots without Redis and connects when it appears.
      redis:
        condition: service_started
    networks: [parrot]

  parrot-grpc:
    build:
      context: .
      dockerfile: Parrot.APi.Grpc/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Kestrel__EndpointDefaults__Protocols: Http2
      JwtSettings__Secret: ${JWT_SECRET:-parrot-local-development-secret-change-me}
      JwtSettings__Issuer: ParrotApi
      JwtSettings__Audience: ParrotApp
      MongoDB__ConnectionString: mongodb://mongodb:27017
      MongoDB__Database: parrot
      MongoDB__Collection: messages
    ports:
      - "5288:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [parrot]

  # One program, three jobs, each its own service so each scales on its own backlog (Worker__Roles):
  #   message-processor: messages.inbound -> MongoDB -> messages.persisted, the only thing that stores incoming messages.
  #   media-worker: copies customers' pictures and files into private storage (messages.media).
  #   outbound-worker: hands agents' pictures and files to WhatsApp or Messenger (messages.outbound).
  # The media and outbound workers idle until Storage__DeferInboundMedia / Outbound__DeferFileSends are turned on.
  message-processor: &message-worker
    build:
      context: .
      dockerfile: MessageProcessor/Dockerfile
    restart: unless-stopped
    environment: &message-worker-env
      DOTNET_ENVIRONMENT: Development
      Worker__Roles: messages
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=parrot;Username=postgres;Password=${POSTGRES_PASSWORD:-parrot_dev_password}
      Kafka__BootstrapServers: kafka:9092
      MongoDB__ConnectionString: mongodb://mongodb:27017
      MongoDB__Database: parrot
      MongoDB__Collection: messages
      # The API's key ring, read only, to look up Facebook and Instagram customers' names.
      DataProtection__KeyRingPath: /app/data-protection-keys
      # Where customers' pictures and files are copied to as their messages arrive.
      Storage__Provider: S3
      Storage__MediaBucket: parrot-private
      Storage__Region: us-east-1
      Storage__ServiceUrl: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER:-parrot-local}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:-parrot-local-secret}
    volumes:
      - api_data_protection_keys:/app/data-protection-keys:ro
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks: [parrot]


  media-worker:
    <<: *message-worker
    environment:
      <<: *message-worker-env
      Worker__Roles: media

  outbound-worker:
    <<: *message-worker
    environment:
      <<: *message-worker-env
      Worker__Roles: outbound

  parrot-web:
    build:
      context: .
      dockerfile: Parrot.Web/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ApiSettings__BaseUrl: http://parrot-api:8080/
      GrpcSettings__BaseUrl: http://parrot-grpc:8080
      # Must match the API's: with it on, agents live in the API and can be turned on.
      OmniAi__Enabled: ${OMNI_AI_ENABLED:-false}
    ports:
      - "5255:8080"
    depends_on:
      - parrot-api
      - parrot-grpc
    networks: [parrot]

  # ---- Catalog service ------------------------------------------------------
  # Creates the catalog's Postgres roles once the database answers. Group roles are
  # NOLOGIN; the *_app users are members. Runs again harmlessly (idempotent SQL).
  catalog-db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-parrot_dev_password}
    volumes:
      - ./infra/catalog/bootstrap-roles.sql:/bootstrap/bootstrap-roles.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -h postgres -U postgres -d parrot -v ON_ERROR_STOP=1 -v dbname=parrot \
          -v migrator_pw=${CATALOG_MIGRATOR_PASSWORD:-catalog_migrator_dev} \
          -v writer_pw=${CATALOG_WRITER_PASSWORD:-catalog_writer_dev} \
          -v reader_pw=${CATALOG_READER_PASSWORD:-catalog_reader_dev} \
          -v relay_pw=${CATALOG_RELAY_PASSWORD:-catalog_relay_dev} \
          -f /bootstrap/bootstrap-roles.sql
    restart: "no"
    networks: [parrot]

  kafka-topic-init-catalog:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - catalog.events
      - --partitions
      - "3"
      - --replication-factor
      - "1"
    restart: "no"
    networks: [parrot]

  catalog-api:
    build:
      context: .
      dockerfile: Parrot.Catalog.Api/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Catalog__ApplyMigrations: "true"
      Catalog__ConnectionStrings__Migrator: Host=postgres;Port=5432;Database=parrot;Username=catalog_migrator;Password=${CATALOG_MIGRATOR_PASSWORD:-catalog_migrator_dev}
      Catalog__ConnectionStrings__Writer: Host=postgres;Port=5432;Database=parrot;Username=catalog_writer_app;Password=${CATALOG_WRITER_PASSWORD:-catalog_writer_dev}
      Catalog__ConnectionStrings__Reader: Host=postgres;Port=5432;Database=parrot;Username=catalog_reader_app;Password=${CATALOG_READER_PASSWORD:-catalog_reader_dev}
      Catalog__ConnectionStrings__Relay: Host=postgres;Port=5432;Database=parrot;Username=catalog_relay_app;Password=${CATALOG_RELAY_PASSWORD:-catalog_relay_dev}
      Catalog__Cache__Provider: Redis
      Catalog__Cache__RedisConnectionString: redis:6379
      Catalog__Relay__InProcess: "false"
      Catalog__Relay__BootstrapServers: kafka:9092
      # Same signing settings as parrot-api, so a session token from the web app works here.
      JwtSettings__Secret: ${JWT_SECRET:-parrot-local-development-secret-change-me}
      JwtSettings__Issuer: ParrotApi
      JwtSettings__Audience: ParrotApp
    ports:
      - "5240:8080"
    depends_on:
      postgres:
        condition: service_healthy
      catalog-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [parrot]

  catalog-relay:
    build:
      context: .
      dockerfile: Parrot.Catalog.Relay/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DOTNET_ENVIRONMENT: Development
      Catalog__ConnectionStrings__Relay: Host=postgres;Port=5432;Database=parrot;Username=catalog_relay_app;Password=${CATALOG_RELAY_PASSWORD:-catalog_relay_dev}
      Catalog__Cache__Provider: Redis
      Catalog__Cache__RedisConnectionString: redis:6379
      Catalog__Relay__Bus: Kafka
      Catalog__Relay__BootstrapServers: kafka:9092
      Catalog__Relay__Topic: catalog.events
    depends_on:
      catalog-api:
        condition: service_started
      kafka-topic-init-catalog:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [parrot]

networks:
  parrot:

volumes:
  api_data_protection_keys:
  postgres_data:
  mongo_data:
  kafka_data:
  minio_data:
