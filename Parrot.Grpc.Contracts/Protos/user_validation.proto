// ValidateUser: after Omni-AI has verified a user's JWT itself (signature, expiry, claims), it
// asks Parrot whether that user may still act in the workspace the token names (the owner, or a
// member whose grant still stands), and what they may do there right now.
//
// Contract defined by Omni-AI for Parrot to implement (see
// docs/integration/parrot-agent-setup-handoff.md). Keep this file byte-identical on both sides.
// Parrot's logic for it already exists: GET /api/workspaces/current/access with the user's token
// (WorkspaceAccessFilter + SessionAccessResponse); this is that answer over gRPC.
//
// Call metadata: "authorization: Bearer <the user's own JWT>" (Omni forwards the caller's token,
// so Parrot answers about that user and nobody else) and "x-correlation-id".
//
// The ids in the request are the token's own claims (sub, tenant_id, workspace_id), never values a
// client sent. Parrot should refuse (valid = false) when they do not match the token it received.
//
// Answers:
//   OK, valid = true        the user may act here; access says what they may do
//   OK, valid = false       they may not
//   UNAUTHENTICATED         the token was refused            (treated as valid = false)
//   PERMISSION_DENIED       not a member of that workspace   (treated as valid = false)
//   NOT_FOUND               no such user                     (treated as valid = false)
//   anything else           Parrot could not answer; Omni fails closed (503)
syntax = "proto3";

package parrot.identity.v1;

option csharp_namespace = "Parrot.Grpc.Contracts.Identity.V1";

service UserValidationService {
  rpc ValidateUser (ValidateUserRequest) returns (ValidateUserResponse);
}

message ValidateUserRequest {
  string user_id = 1;       // the token's "sub"
  string tenant_id = 2;     // the token's "tenant_id"
  string workspace_id = 3;  // the token's "workspace_id"
}

message ValidateUserResponse {
  bool valid = 1;
  // What the user may do in the workspace now, from their live grant (not the token's copy).
  // Set when valid. Omni authorises agent changes with it.
  WorkspaceAccess access = 2;
}

message WorkspaceAccess {
  string role = 1;                  // "Owner", or the name of the role held there
  repeated string permissions = 2;  // permission keys, e.g. "agents.create"; the owner has every one
  repeated string channels = 3;     // channel keys reached ("whatsapp", "facebook"...); empty = every channel
}
