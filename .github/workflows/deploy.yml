name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    # The catalog's integration and tenant-isolation suites run against a real
    # Postgres; without this service they are skipped, not failed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CATALOG_TEST_CONNECTION: Host=localhost;Port=5432;Database=catalog_test;Username=postgres;Password=test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Two solution files exist at the repo root (Backend.slnx, Parrot.Api.slnx);
      # pin the one without Parrot.Mobile or dotnet restore fails with MSB1011.
      - run: dotnet restore Backend.slnx
      - run: dotnet build Backend.slnx --configuration Release --no-restore
      - run: dotnet test Backend.slnx --configuration Release --no-build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # No registry involved: SSH to the AWS server, pull the new commit, and
      # let docker compose build the images and start the stack in place.
      - name: Build & deploy on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.PARROT_PRIVATE_KEY }}
          envs: GITHUB_REPOSITORY,GITHUB_TOKEN
          script: |
            set -euo pipefail
            cd ${{ vars.SERVER_APP_DIR || '/home/ubuntu/Parrot' }}
            # certbot/nginx containers write into this tree as root, and .git
            # ownership can drift after manual sudo commands; reclaim both
            # before touching anything or git refuses to write/overwrite files.
            sudo chown -R "$(id -un)":"$(id -gn)" .
            git fetch https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git main
            git reset --hard FETCH_HEAD
            sudo docker compose --env-file .env.prod build
            sudo docker compose --env-file .env.prod up -d --remove-orphans
            # nginx resolves upstream container names once, when it starts, and
            # keeps the addresses. Recreated containers can come back on each
            # other's old IPs (parrot-api and parrot-grpc swapped once, and every
            # API request landed on gRPC as a 404), so make it look them up
            # again; fall back to a restart if a reload is refused.
            sudo docker compose --env-file .env.prod exec -T nginx nginx -s reload || sudo docker compose --env-file .env.prod restart nginx
            sudo docker system prune -af --volumes=false
            sudo docker builder prune -af
