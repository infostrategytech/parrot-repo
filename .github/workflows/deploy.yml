name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_ACCOUNT_ID: 433132207341
  AWS_DEFAULT_REGION: us-west-1
  ECR_REPOSITORY: parrot-app

jobs:
  test:
    runs-on: ubuntu-latest
    # The catalog's integration and tenant-isolation suites run against a real
    # Postgres; without this service they are skipped, not failed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CATALOG_TEST_CONNECTION: Host=localhost;Port=5432;Database=catalog_test;Username=postgres;Password=test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Two solution files exist at the repo root (Backend.slnx, Parrot.Api.slnx);
      # pin the one without Parrot.Mobile or dotnet restore fails with MSB1011.
      - run: dotnet restore Backend.slnx
      - run: dotnet build Backend.slnx --configuration Release --no-restore
      - run: dotnet test Backend.slnx --configuration Release --no-build

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: parrot-api
            dockerfile: Parrot.Api/Dockerfile
            context: .
          - name: parrot-grpc
            dockerfile: Parrot.APi.Grpc/Dockerfile
            context: .
          - name: whatsapp-ingestor
            dockerfile: MessageProcessor/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set default.region ${{ env.AWS_DEFAULT_REGION }}

      - name: Login to ECR and Build/Push Docker Image
        run: |
          aws ecr get-login-password --region ${{ env.AWS_DEFAULT_REGION }} \
            | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com

          docker build -f ${{ matrix.service.dockerfile }} -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}/${{ matrix.service.name }}:${{ github.sha }} -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}/${{ matrix.service.name }}:latest ${{ matrix.service.context }}

          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}/${{ matrix.service.name }}:${{ github.sha }}
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}/${{ matrix.service.name }}:latest

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.PARROT_PRIVATE_KEY }}
          script: |
            cd ${{ vars.SERVER_APP_DIR || '/home/ubuntu/Parrot' }}
            aws ecr get-login-password --region ${{ env.AWS_DEFAULT_REGION }} \
              | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com

            docker compose -f infra/docker-compose.prod.yml pull
            docker compose -f infra/docker-compose.prod.yml down
            docker compose -f infra/docker-compose.prod.yml up -d

            echo "✅ Parrot deployed successfully"
