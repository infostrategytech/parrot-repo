name: CI/CD

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

env:
  AWS_ACCOUNT_ID: 433132207341
  AWS_DEFAULT_REGION: us-west-1
  ECR_REPOSITORY: parrot-app

jobs:
  test:
    runs-on: ubuntu-latest
    # The catalog's integration and tenant-isolation suites run against a real
    # Postgres; without this service they are skipped, not failed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CATALOG_TEST_CONNECTION: Host=localhost;Port=5432;Database=catalog_test;Username=postgres;Password=test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Two solution files exist at the repo root (Backend.slnx, Parrot.Api.slnx);
      # pin the one without Parrot.Mobile or dotnet restore fails with MSB1011.
      - run: dotnet restore Backend.slnx
      - run: dotnet build Backend.slnx --configuration Release --no-restore
      - run: dotnet test Backend.slnx --configuration Release --no-build

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: parrot-api
            dockerfile: Parrot.Api/Dockerfile
            context: .
          - name: parrot-grpc
            dockerfile: Parrot.APi.Grpc/Dockerfile
            context: .
          - name: whatsapp-ingestor
            dockerfile: MessageProcessor/Dockerfile
            context: .
          - name: parrot-web
            dockerfile: Parrot.Web/Dockerfile
            context: .
          - name: parrot-catalog-api
            dockerfile: Parrot.Catalog.Api/Dockerfile
            context: .
          - name: parrot-catalog-relay
            dockerfile: Parrot.Catalog.Relay/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Login to ECR and build/push Docker image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          IMAGE_REPOSITORY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          SERVICE: ${{ matrix.service.name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID secret is required}"
          : "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY secret is required}"
          aws ecr get-login-password --region ${{ env.AWS_DEFAULT_REGION }} \
            | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com

          docker build -f ${{ matrix.service.dockerfile }} \
            -t "${IMAGE_REPOSITORY}:${SERVICE}-${IMAGE_TAG}" \
            -t "${IMAGE_REPOSITORY}:${SERVICE}-latest" ${{ matrix.service.context }}
          docker push "${IMAGE_REPOSITORY}:${SERVICE}-${IMAGE_TAG}"
          docker push "${IMAGE_REPOSITORY}:${SERVICE}-latest"

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.PARROT_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd "${{ vars.SERVER_APP_DIR || '/home/ubuntu/Parrot' }}"
            IMAGE_TAG="${{ github.sha }}"
            IMAGE_REPOSITORY="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}"

            images=$(sudo env IMAGE_TAG="$IMAGE_TAG" docker compose --env-file .env.prod -f docker-compose.yaml config --images)
            for service in parrot-api parrot-grpc whatsapp-ingestor parrot-web parrot-catalog-api parrot-catalog-relay; do
              if ! printf '%s\n' "$images" | grep -Fxq "${IMAGE_REPOSITORY}:${service}-${IMAGE_TAG}"; then
                echo "Server Compose is missing expected image for ${service}; update docker-compose.yaml before deploying." >&2
                exit 1
              fi
            done

            aws ecr get-login-password --region ${{ env.AWS_DEFAULT_REGION }} \
              | sudo docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com
            sudo env IMAGE_TAG="$IMAGE_TAG" docker compose --env-file .env.prod -f docker-compose.yaml pull
            sudo env IMAGE_TAG="$IMAGE_TAG" docker compose --env-file .env.prod -f docker-compose.yaml up -d
            sudo env IMAGE_TAG="$IMAGE_TAG" docker compose --env-file .env.prod -f docker-compose.yaml exec -T nginx nginx -s reload || sudo env IMAGE_TAG="$IMAGE_TAG" docker compose --env-file .env.prod -f docker-compose.yaml restart nginx
